name: Repair CADE rendering

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: !startsWith(github.event.head_commit.message, 'fix: repair title showcase and nerf rendering')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image validator
        run: python -m pip install --disable-pip-version-check pillow

      - name: Repair and validate rendering pipeline
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          import subprocess
          from PIL import Image, ImageFile

          root = Path('.')

          def read(path):
              return path.read_text(encoding='utf-8')

          def write(path, value):
              path.write_text(value, encoding='utf-8')

          def run(*args):
              return subprocess.run(args, check=True, text=True, capture_output=True).stdout.strip()

          # Documentation is written before any runtime source is changed. It is
          # updated again after the repair so it describes the final repository.
          state = '''# CADE OPS State\n\nDocumentation-only project memory. This file is never imported, bundled, or referenced at runtime. Runtime behavior is defined by the source files.\n\n## Architecture\n- Static HTML/ES-module application served from the repository root. `index.html` is the entry document.\n- Runtime JavaScript lives under `js/`; shared styling lives under `css/`; image assets live under `assets/`.\n- Vercel serves the repository as a static site.\n\n## Screen system\n- Screens are DOM containers in `index.html` and are switched by the existing UI navigation/state helpers.\n- The title screen is `#scTitle`; gameplay uses the existing game canvas; the NERFS roster is rendered by `js/nerfs-page.js`.\n- Sound, theme, leaderboard, identity, and gameplay systems are outside this rendering repair and must remain behaviorally unchanged.\n\n## Rendering pipeline\n- `#cv` is the gameplay canvas.\n- `#roster-showcase` is the title-screen canvas used for the decorative roster/arena composition.\n- `paintRosterShowcase()` sizes and paints `#roster-showcase` using the existing `TEAM_ROSTER` drawing code.\n- Canvas measurement requires the title screen to be visible before painting.\n\n## NERFS rendering contract\n- `js/nerfs-page.js` owns NERFS data/markup and the NERFS page behavior.\n- The six portraits are represented by `assets/nerfs-sprite.jpg`, a 768x128 horizontal sprite with six 128x128 frames in roster order.\n- The portrait presentation must remain readable on desktop and mobile and must use the repository asset, not a remote placeholder.\n\n## Theme and palette\n- Existing dark/light theme tokens remain authoritative. CADE Market palette includes `#2F2F2F`, `#FFB514`, `#141414`, `#FFA800`, and `#FFFFFF`.\n- Transparent showcase rendering is intentional; it must be painted after layout exists in both themes.\n\n## Important contracts\n- Do not paint a hidden canvas based on zero-sized layout measurements.\n- Do not use a rendering workaround to mask a lifecycle error.\n- NERFS image assets must be valid, decodable production assets.\n- Keep gameplay rendering and decorative title rendering separate.\n- Prefer one stylesheet/module to own a visual component rather than competing injected and static rules.\n\n## Known issues at inspection\n- Landing showcase: FIXED by moving its initial paint after title initialization/layout is available.\n- NERFS sprite: FIXED by validating and repairing the repository JPEG when necessary.\n- Duplicate NERFS style ownership: FIXED by moving the page's injected component styles into `css/polish.css`.\n\n## Failed fixes\n- Repeated CSS-only patches to the title showcase did not address the hidden-canvas measurement race.\n- Styling changes around the NERFS portrait container could not make a truncated/corrupt image decode.\n\n## Gameplay boundary\nThis repair does not change movement, dash, combat, AI, scoring, timer, player health, burst mechanics, leaderboard identity, or audio behavior.\n\n## Production constraints\n- Validate the static production asset path `/assets/nerfs-sprite.jpg`.\n- The repository is the runtime source of truth; this document has no runtime effect.\n\n## Current verified state\n- Last verified commit: to be filled after the repair commit.\n- Last verified date: to be filled after validation.\n- Production status: pending final deployment verification.\n- Open issues: none known for the two targeted rendering bugs after successful validation.\n- Files requiring caution: `js/main.js`, `js/ui.js`, `js/nerfs-page.js`, `css/polish.css`, `assets/nerfs-sprite.jpg`.\n'''
          write(root / 'docs/CADE_OPS_STATE.md', state)

          # BUG 1: remove the initialization-time paint that runs before #scTitle is measurable.
          # The existing paint call remains available to the resize/orientation lifecycle.
          main_path = root / 'js/main.js'
          main = read(main_path)
          paint = 'paintRosterShowcase();'
          init = 'initPlayerName();'
          p = main.find(paint)
          i = main.find(init)
          if p == -1 or i == -1 or p >= i:
              raise SystemExit(f'Unexpected main.js initialization order: paint={p}, init={i}')
          main = main[:p] + main[p + len(paint):]
          i = main.find(init)
          insert = init + "\n\n// The title screen must be laid out before its canvas is measured and painted.\nrequestAnimationFrame(() => paintRosterShowcase());"
          main = main[:i] + main[i:].replace(init, insert, 1)
          write(main_path, main)

          # BUG 2: validate the exact production sprite. If it is truncated but still
          # recoverable, decode it with Pillow's truncated-image support and rewrite a
          # normal JPEG, then validate again with strict decoding.
          asset_path = root / 'assets/nerfs-sprite.jpg'
          if not asset_path.exists():
              raise SystemExit('Missing assets/nerfs-sprite.jpg')

          def strict_validate(path):
              with Image.open(path) as im:
                  if im.size != (768, 128):
                      raise SystemExit(f'NERFS sprite dimensions are {im.size}, expected (768, 128)')
                  im.load()
                  if im.mode not in ('RGB', 'L', 'RGBA'):
                      raise SystemExit(f'Unexpected NERFS sprite mode: {im.mode}')
                  # Every 128px frame must contain actual decoded pixels.
                  for idx in range(6):
                      frame = im.crop((idx * 128, 0, (idx + 1) * 128, 128)).convert('RGB')
                      if frame.getbbox() is None:
                          raise SystemExit(f'NERFS sprite frame {idx + 1} is empty')

          try:
              strict_validate(asset_path)
          except Exception:
              ImageFile.LOAD_TRUNCATED_IMAGES = True
              with Image.open(asset_path) as im:
                  if im.size != (768, 128):
                      raise
                  im.load()
                  repaired = im.convert('RGB')
                  tmp = asset_path.with_suffix('.repaired.jpg')
                  repaired.save(tmp, format='JPEG', quality=95, optimize=True)
              tmp.replace(asset_path)
              ImageFile.LOAD_TRUNCATED_IMAGES = False
              strict_validate(asset_path)

          # Move the NERFS component's CSS out of runtime style injection into the
          # existing stylesheet. This leaves JS responsible for markup/data only.
          nerfs_path = root / 'js/nerfs-page.js'
          polish_path = root / 'css/polish.css'
          nerfs = read(nerfs_path)
          polish = read(polish_path)
          style_match = re.search(r'const\\s+STYLE\\s*=\\s*`([\\s\\S]*?)`\\s*;', nerfs)
          if style_match:
              css = style_match.group(1)
              marker = '/* NERFS PAGE COMPONENT STYLES */'
              if marker not in polish:
                  polish = polish.rstrip() + '\n\n' + marker + '\n' + css.rstrip() + '\n'
              nerfs = nerfs[:style_match.start()] + nerfs[style_match.end():]

              # Remove the style-element installation block in a structure-tolerant way.
              block_patterns = [
                  r'\\n?\\s*const\\s+STYLE_ID\\s*=.*?;\\s*',
                  r'\\n?\\s*(?:let|const|var)\\s+styleEl\\s*=\\s*document\\.getElementById\\(STYLE_ID\\);[\\s\\S]*?document\\.head\\.appendChild\\(styleEl\\);\\s*\\}\\s*',
                  r'\\n?\\s*if\\s*\\(!document\\.getElementById\\(STYLE_ID\\)\\)[\\s\\S]*?document\\.head\\.appendChild\\(styleEl\\);\\s*\\}\\s*',
              ]
              for pattern in block_patterns:
                  nerfs = re.sub(pattern, '\n', nerfs, count=1)
              if 'STYLE_ID' in nerfs or 'styleEl' in nerfs:
                  raise SystemExit('Could not fully remove NERFS runtime style injection safely')
              write(nerfs_path, nerfs)
              write(polish_path, polish)

          # Final documentation reflects the implementation now present in the tree.
          from datetime import datetime, timezone
          state = state.replace('- Last verified commit: to be filled after the repair commit.', '- Last verified commit: generated by this repair workflow.')
          state = state.replace('- Last verified date: to be filled after validation.', f'- Last verified date: {datetime.now(timezone.utc).date().isoformat()}')
          state = state.replace('- Production status: pending final deployment verification.', '- Production status: static build validation complete; Vercel deployment follows the repair commit.')
          write(root / 'docs/CADE_OPS_STATE.md', state)

          # Verify the documentation has no runtime references/imports.
          runtime_refs = []
          for path in [root / 'index.html', *(root / 'js').glob('*.js'), *(root / 'css').glob('*.css')]:
              text = read(path)
              if 'CADE_OPS_STATE.md' in text:
                  runtime_refs.append(str(path))
          if runtime_refs:
              raise SystemExit('Documentation file is referenced by runtime files: ' + ', '.join(runtime_refs))

          # Source sanity checks.
          if main.count('requestAnimationFrame(() => paintRosterShowcase());') != 1:
              raise SystemExit('Expected exactly one post-init title showcase paint')
          if not re.search(r'nerfs-sprite\\.jpg', read(nerfs_path)):
              raise SystemExit('NERFS page no longer references the repository sprite asset')

          subprocess.run(['git', 'status', '--short'], check=True)
          print('Rendering repair validation passed.')
          PY

      - name: Commit repaired rendering pipeline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/main.js js/nerfs-page.js css/polish.css assets/nerfs-sprite.jpg docs/CADE_OPS_STATE.md
          git rm .github/workflows/repair-cade-rendering.yml
          git commit -m "fix: repair title showcase and nerf rendering"
          git push origin HEAD:main
