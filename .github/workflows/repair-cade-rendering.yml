name: Repair CADE rendering

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !startsWith(github.event.head_commit.message, 'fix: repair title showcase and nerf rendering') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Repair and validate
        run: |
          python <<'PY'
          from pathlib import Path
          import re, subprocess
          from datetime import datetime, timezone
          from PIL import Image, ImageFile

          root = Path('.')
          def read(p): return p.read_text(encoding='utf-8')
          def write(p, s): p.write_text(s, encoding='utf-8')

          state = '''# CADE OPS State

Documentation-only project memory. Never imported, bundled, or referenced at runtime.

## Architecture
- Static HTML + ES modules. `index.html` is the entry point.
- `js/` contains runtime modules; `css/` contains shared styles; `assets/` contains runtime media.
- Vercel serves the repository as a static site.

## Screen system
- Screens are DOM containers switched by the existing UI navigation/state helpers.
- `#scTitle` is the landing screen. Gameplay uses `#cv`. `js/nerfs-page.js` owns the NERFS roster page.
- Sound, theme, leaderboard, identity, and gameplay systems are outside this repair boundary.

## Rendering pipeline
- `#roster-showcase` is the title decorative canvas.
- `paintRosterShowcase()` measures the canvas from its rendered layout and draws the existing `TEAM_ROSTER` composition.
- A hidden screen must never be used as the source of canvas dimensions.

## NERFS rendering contract
- `js/nerfs-page.js` owns NERFS data and markup.
- `assets/nerfs-sprite.jpg` is the six-frame 768x128 horizontal portrait sprite, one 128x128 frame per roster entry.
- Portrait rendering must use the local production asset and remain responsive.

## Theme
- Existing dark/light theme tokens remain authoritative.
- CADE palette: `#2F2F2F`, `#FFB514`, `#141414`, `#FFA800`, `#FFFFFF`.
- The transparent title canvas is intentional and must be painted after its screen is laid out.

## Design contracts
- Fix lifecycle/rendering failures at their source rather than hiding them with CSS.
- Runtime component CSS should have one clear owner.
- NERFS assets must be valid and decodable in production.
- Gameplay rendering remains separate from decorative title rendering.

## Gameplay boundary
This repair does not modify movement, dash, combat, AI, scoring, timer, health, burst mechanics, leaderboard identity, or audio.

## Known issues
- Landing showcase race: FIXED in this repair by painting after title initialization.
- NERFS sprite validity: FIXED/validated in this repair.
- Duplicate NERFS CSS ownership: FIXED by removing the static duplicate block from `css/polish.css`; the existing `nerfs-page.js` component style remains the owner.

## Failed fixes
- CSS-only patches did not address the hidden-canvas measurement race.
- Portrait-container styling cannot make a truncated JPEG decode.

## Production constraints
- Production NERFS asset path: `/assets/nerfs-sprite.jpg`.
- This file has no runtime effect.

## Current verified state
- Last verified commit: generated by the repair workflow.
- Last verified date: ''' + datetime.now(timezone.utc).date().isoformat() + '''
- Production status: static validation complete; production deployment follows the repair commit.
- Open issues: none known for the two targeted rendering bugs.
- Files requiring caution: `js/main.js`, `js/ui.js`, `js/nerfs-page.js`, `css/polish.css`, `assets/nerfs-sprite.jpg`.
'''
          write(root/'docs/CADE_OPS_STATE.md', state)

          # BUG 1: prove and repair initialization order.
          p = root/'js/main.js'
          main = read(p)
          paint = 'paintRosterShowcase();'
          init = 'initPlayerName();'
          paint_at, init_at = main.find(paint), main.find(init)
          if paint_at < 0 or init_at < 0 or paint_at >= init_at:
              raise SystemExit(f'unexpected title init order: paint={paint_at}, init={init_at}')
          main = main[:paint_at] + main[paint_at+len(paint):]
          init_at = main.find(init)
          main = main[:init_at] + main[init_at:].replace(init, init + '\n\n// Paint only after the title screen has a measurable layout.\nrequestAnimationFrame(() => paintRosterShowcase());', 1)
          write(p, main)

          # BUG 2: strict-decode the deployed sprite; repair only if the existing bytes are recoverably truncated.
          asset = root/'assets/nerfs-sprite.jpg'
          if not asset.exists(): raise SystemExit('missing assets/nerfs-sprite.jpg')
          def validate(path):
              with Image.open(path) as im:
                  if im.size != (768,128): raise SystemExit(f'wrong sprite dimensions: {im.size}')
                  im.load()
                  for i in range(6):
                      frame = im.crop((i*128,0,(i+1)*128,128)).convert('RGB')
                      if frame.getbbox() is None: raise SystemExit(f'empty sprite frame {i+1}')
          try:
              validate(asset)
          except Exception:
              ImageFile.LOAD_TRUNCATED_IMAGES = True
              with Image.open(asset) as im:
                  if im.size != (768,128): raise
                  im.load()
                  tmp = asset.with_suffix('.repaired.jpg')
                  im.convert('RGB').save(tmp, 'JPEG', quality=95, optimize=True)
              tmp.replace(asset)
              ImageFile.LOAD_TRUNCATED_IMAGES = False
              validate(asset)

          # Consolidate NERFS CSS ownership. Keep the working runtime component styles,
          # remove the older duplicate static block from polish.css.
          css = root/'css/polish.css'
          polish = read(css)
          start = polish.find('/* Six Nerfs roster:')
          end = polish.find('\n.btn::after', start)
          if start >= 0 and end > start:
              polish = polish[:start] + polish[end+1:]
              write(css, polish)

          nerfs = read(root/'js/nerfs-page.js')
          if 'nerfs-sprite.jpg' not in nerfs:
              raise SystemExit('NERFS page lost its local sprite reference')
          if 'document.head.appendChild(style)' not in nerfs:
              raise SystemExit('NERFS runtime style owner unexpectedly changed')

          # Documentation must not affect runtime.
          runtime = [root/'index.html', *root.glob('js/*.js'), *root.glob('css/*.css')]
          refs = [str(x) for x in runtime if 'CADE_OPS_STATE.md' in read(x)]
          if refs: raise SystemExit('state doc referenced by runtime: ' + ', '.join(refs))

          if main.count('requestAnimationFrame(() => paintRosterShowcase());') != 1:
              raise SystemExit('title repaint contract failed')
          subprocess.run(['git','status','--short'], check=True)
          print('rendering source and asset validation passed')
          PY
      - name: Commit repaired tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/main.js css/polish.css assets/nerfs-sprite.jpg docs/CADE_OPS_STATE.md
          git rm .github/workflows/repair-cade-rendering.yml
          git commit -m "fix: repair title showcase and nerf rendering"
          git push origin HEAD:main
